<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg">
  <title>fakegpt</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #ffffff; --panel: #f7f7f8; --card: #ffffff; --border: #e4e4e7; --input-border: #d4d4d8;
      --text: #18181b; --muted: #71717a; --accent: #10a37f; --bot: #f7f7f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10; --panel: #1a1a1c; --card: #18181c; --border: #2a2a2e; --input-border: #2a2a2e;
        --text: #ececf1; --muted: #a1a1aa; --accent: #10a37f; --bot: #1a1a1c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); }
    #root { display: flex; flex-direction: column; height: 100dvh; width: min(100%, 720px); margin: 0 auto; }

    header { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

    #messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 14px; border-radius: 16px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
    .msg.bot a { color: var(--accent); font-weight: 600; }
    .msg.typing { color: var(--muted); letter-spacing: 2px; }

    form#composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
    #composer input { flex: 1 1 auto; min-width: 0; height: 46px; border: 1px solid var(--input-border); border-radius: 10px; padding: 12px 14px; background: var(--card); color: var(--text); font: inherit; font-size: 16px; }
    #composer input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    #composer button { flex: 0 0 auto; height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    #composer button:disabled { opacity: .45; cursor: not-allowed; }
    #composer input:disabled { opacity: .6; }

    footer { flex: 0 0 auto; padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: var(--muted); }

    /* Materials screen (release), mirrors the flow's screen. */
    .release { margin: auto; width: min(100%, 420px); padding: 24px; text-align: center; }
    .release h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
    .release .button { display: inline-flex; width: 100%; height: 48px; align-items: center; justify-content: center; margin: 8px 0 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; }
    .release .sub { margin: 0; font-size: 14px; color: var(--muted); }
    .release-footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
    .release-footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/tracker.min.js"></script>
  <script type="module" src="/fakegpt.js"></script>
</body>
</html>
